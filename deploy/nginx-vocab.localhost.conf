# vocab — the dictionary overlay's API, also reachable as a browser page.
# The overlay itself loads the same URL over loopback; this vhost is for using it
# in a browser tab, and is deliberately loopback-only.
server {
    listen 80;
    listen [::]:80;

    server_name vocab.localhost;

    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8787;

        # Answers stream over SSE: buffering would hold them back until the last
        # token instead of letting them appear word by word.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A look-up can sit idle between tokens; do not cut the socket.
        proxy_read_timeout 3600;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
